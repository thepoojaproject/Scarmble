<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#080b14"><title>Scramble — Word Challenge</title><style>
*{box-sizing:border-box;margin:0;padding:0}body{min-height:100vh;font-family:Arial,Helvetica,sans-serif;color:#f5f7ff;background:radial-gradient(circle at 15% 10%,#7c5cff30,transparent 30%),radial-gradient(circle at 90% 90%,#35d49a18,transparent 30%),#080b14;display:flex;justify-content:center;align-items:center;padding:18px}.app{width:100%;max-width:510px}.header{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.logo{display:flex;align-items:center;gap:11px}.logo-icon{width:43px;height:43px;border-radius:13px;display:grid;place-items:center;background:linear-gradient(135deg,#7c5cff,#5539d8);font-size:21px}.logo h1{font-size:19px}.logo span{display:block;color:#8f98ad;font-size:11px;margin-top:3px}.sound{width:42px;height:42px;border-radius:12px;border:1px solid #ffffff12;background:#ffffff08;color:#fff;cursor:pointer;font-size:17px}.card{background:#111625f5;border:1px solid #ffffff12;border-radius:25px;padding:24px;box-shadow:0 25px 70px #0009;backdrop-filter:blur(18px)}.hidden{display:none!important}.login h2,.gameover h2,.scores h2{text-align:center;margin-bottom:8px}.login p,.gameover p{color:#8f98ad;text-align:center;font-size:13px;margin-bottom:22px}input{width:100%;height:56px;border-radius:14px;border:1px solid #ffffff12;background:#0c101c;color:#fff;outline:none;padding:0 17px;font-size:15px;text-align:center;margin-bottom:10px}input:focus{border-color:#7c5cff;box-shadow:0 0 0 4px #7c5cff18}.btn{width:100%;height:53px;border:0;border-radius:14px;margin-top:10px;font-weight:700;cursor:pointer;color:#fff;font-size:14px}.main{background:linear-gradient(135deg,#7c5cff,#6043e8);box-shadow:0 10px 25px #7c5cff25}.secondary{background:#ffffff08;border:1px solid #ffffff12;color:#dfe3ed}.message{min-height:28px;text-align:center;margin-top:14px;font-size:13px;font-weight:600}.correct{color:#35d49a}.wrong{color:#ff5d73}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:22px}.stat{background:#171d2d;border:1px solid #ffffff0d;border-radius:15px;padding:13px}.label{color:#8f98ad;font-size:10px;text-transform:uppercase;letter-spacing:1px}.value{font-size:19px;font-weight:800;margin-top:5px}.progress-head{display:flex;justify-content:space-between;color:#8f98ad;font-size:11px;margin-bottom:8px}.progress{height:6px;background:#252b3c;border-radius:20px;overflow:hidden;margin-bottom:27px}.progress-bar{height:100%;width:10%;background:linear-gradient(90deg,#7c5cff,#9a82ff);border-radius:20px;transition:.35s}.challenge{text-align:center}.badge{display:inline-block;padding:6px 11px;border-radius:20px;background:#7c5cff1f;color:#b9aaff;font-size:10px;font-weight:bold;letter-spacing:1px}.challenge h2{font-size:14px;color:#8f98ad;font-weight:500;margin-top:12px}.word{min-height:105px;display:flex;justify-content:center;align-items:center;font-size:clamp(30px,8vw,48px);font-weight:800;letter-spacing:8px;word-break:break-word}.timer{display:inline-block;padding:8px 15px;border-radius:30px;background:#ffffff08;border:1px solid #ffffff12;font-size:13px;font-weight:700;margin-bottom:18px}.timer.warning{color:#ff5d73}.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}.trophy{font-size:58px;text-align:center;margin-bottom:12px}.final-score{font-size:45px;font-weight:800;color:#9a82ff;text-align:center;margin:15px 0 25px}.score-list{margin:18px 0}.score-row{display:flex;justify-content:space-between;padding:13px;border-bottom:1px solid #ffffff0b}.score-row:first-child{color:#ffd86b;font-weight:700}.footer{text-align:center;color:#697286;font-size:10px;margin-top:15px}@media(max-width:430px){body{padding:10px;align-items:flex-start;padding-top:18px}.card{padding:18px;border-radius:21px}.word{letter-spacing:5px;min-height:90px}}
</style></head><body><div class="app"><header class="header"><div class="logo"><div class="logo-icon">🔤</div><div><h1>Scramble</h1><span>Word Challenge</span></div></div><button class="sound" id="soundBtn" onclick="toggleSound()">🔊</button></header><div class="card">
<section id="loginScreen"><h2>Welcome Back</h2><p>Sign in to start the challenge</p><input id="username" placeholder="Username" autocomplete="off"><input id="password" type="password" placeholder="Password"><button class="btn main" onclick="login()">Login</button><div id="loginMessage" class="message"></div></section>
<section id="gameScreen" class="hidden"><div class="stats"><div class="stat"><div class="label">Score</div><div class="value" id="score">0</div></div><div class="stat"><div class="label">Streak</div><div class="value">🔥 <span id="streak">0</span></div></div><div class="stat"><div class="label">Best</div><div class="value" id="best">0</div></div></div><div class="progress-head"><span>Challenge Progress</span><span id="roundText">1 / 10</span></div><div class="progress"><div class="progress-bar" id="progressBar"></div></div><div class="challenge"><div class="badge">UNSCRAMBLE</div><h2>Find the hidden word</h2><div class="word" id="scrambledWord">READY</div><div class="timer" id="timer">⏱ 30s</div><input id="answer" placeholder="Type your answer..." autocomplete="off" spellcheck="false"><button class="btn main" onclick="checkAnswer()">Check Answer</button><div class="actions"><button class="btn secondary" onclick="showHint()">💡 Hint</button><button class="btn secondary" onclick="skipWord()">Skip →</button></div><div id="gameMessage" class="message"></div></div></section>
<section id="gameOverScreen" class="hidden"><div class="trophy">🏆</div><h2>Challenge Complete</h2><p>Your final score</p><div class="final-score"><span id="finalScore">0</span>/10</div><div id="saveArea" class="hidden"><p>🎉 Your score qualifies for the Top 5!</p><input id="playerName" maxlength="20" placeholder="Enter your name"><button class="btn main" onclick="saveHighScore()">Save Score</button></div><button class="btn secondary" onclick="showHighScores()">🏆 High Scores</button><button class="btn main" onclick="restartGame()">Play Again</button></section>
<section id="scoresScreen" class="hidden"><h2>🏆 Top 5 High Scores</h2><div id="scoreList" class="score-list"></div><button class="btn main" onclick="backToGameOver()">Back</button></section>
</div><div class="footer">Made in ❤ for Neelam</div></div>
<script>
const WORDS=[["APPLE","A red or green fruit"],["PLANET","Earth is one of these"],["COMPUTER","An electronic device"],["SCHOOL","A place where students learn"],["GARDEN","A place where plants grow"],["ELEPHANT","A huge animal with a trunk"],["FOOTBALL","A popular sport"],["KEYBOARD","Used for typing"],["MOUNTAIN","A very high landform"],["SUNSHINE","Light from the sun"],["BIRTHDAY","Celebrated every year"],["INTERNET","A worldwide network"],["CHOCOLATE","A sweet food"],["RAINBOW","Seven colors appear in this"],["AIRPLANE","A vehicle that flies"],["LIBRARY","A place full of books"],["CAMERA","Used to capture photos"],["MUSIC","You listen to this"],["DIAMOND","A valuable gemstone"],["ADVENTURE","An exciting experience"]];
let currentWord="",currentHint="",score=0,streak=0,round=1,time=30,timerInterval=null,usedWords=[],soundEnabled=true;const $=id=>document.getElementById(id);
function getScores(){return JSON.parse(localStorage.getItem("scrambleTop5")||"[]")}function best(){let s=getScores();return s.length?s[0].score:0}
function shuffle(w){let a=w.split("");do{for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}}while(a.join("")===w);return a.join("")}
function login(){if($("username").value.trim()==="Neelam"&&$("password").value==="Neelam143"){$("loginScreen").classList.add("hidden");$("gameScreen").classList.remove("hidden");startGame()}else{$("loginMessage").textContent="Invalid username or password.";$("loginMessage").className="message wrong"}}
function startGame(){score=0;streak=0;round=1;usedWords=[];$("score").textContent=0;$("streak").textContent=0;$("best").textContent=best();loadWord()}
function loadWord(){if(round>10)return endGame();let a=WORDS.filter(x=>!usedWords.includes(x[0]));let x=a[Math.floor(Math.random()*a.length)];currentWord=x[0];currentHint=x[1];usedWords.push(currentWord);$("scrambledWord").textContent=shuffle(currentWord);$("answer").value="";$("gameMessage").textContent="";$("gameMessage").className="message";$("roundText").textContent=`${round} / 10`;$("progressBar").style.width=round*10+"%";time=30;updateTimer();clearInterval(timerInterval);timerInterval=setInterval(()=>{time--;updateTimer();if(time<=0){clearInterval(timerInterval);$("gameMessage").textContent=`Time's up! Answer: ${currentWord}`;$("gameMessage").className="message wrong";streak=0;$("streak").textContent=0;setTimeout(nextWord,1000)}},1000);$("answer").focus()}
function updateTimer(){$("timer").textContent=`⏱ ${time}s`;$("timer").classList.toggle("warning",time<=8)}
function checkAnswer(){let a=$("answer").value.trim().toUpperCase();if(!a)return;if(a===currentWord){clearInterval(timerInterval);let p=Math.max(1,Math.ceil(time/5));score+=p;streak++;$("score").textContent=score;$("streak").textContent=streak;$("best").textContent=Math.max(score,best());$("gameMessage").textContent=`✓ Correct! +${p} points`;$("gameMessage").className="message correct";setTimeout(nextWord,850)}else{streak=0;$("streak").textContent=0;$("gameMessage").textContent="✕ Incorrect. Try again!";$("gameMessage").className="message wrong"}}
function showHint(){$("gameMessage").textContent="💡 "+currentHint;$("gameMessage").className="message"}
function skipWord(){clearInterval(timerInterval);$("gameMessage").textContent=`Skipped • Answer: ${currentWord}`;$("gameMessage").className="message wrong";streak=0;$("streak").textContent=0;setTimeout(nextWord,800)}
function nextWord(){round++;loadWord()}
function endGame(){clearInterval(timerInterval);$("gameScreen").classList.add("hidden");$("gameOverScreen").classList.remove("hidden");$("finalScore").textContent=score;let s=getScores();$("saveArea").classList.toggle("hidden",!(score>0&&(s.length<5||score>s[s.length-1].score)))}
function saveHighScore(){let n=$("playerName").value.trim()||"Player",s=getScores();s.push({name:n,score:score});s.sort((a,b)=>b.score-a.score);localStorage.setItem("scrambleTop5",JSON.stringify(s.slice(0,5)));$("saveArea").classList.add("hidden");showHighScores()}
function showHighScores(){$("gameOverScreen").classList.add("hidden");$("scoresScreen").classList.remove("hidden");let s=getScores();$("scoreList").innerHTML=s.length?s.map((x,i)=>`<div class="score-row"><span>${i+1}. ${safe(x.name)}</span><strong>${x.score}</strong></div>`).join(""):"<p style='text-align:center;color:#8f98ad'>No high scores saved yet.</p>"}
function safe(x){return String(x).replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;")}
function backToGameOver(){$("scoresScreen").classList.add("hidden");$("gameOverScreen").classList.remove("hidden")}
function restartGame(){$("gameOverScreen").classList.add("hidden");$("scoresScreen").classList.add("hidden");$("gameScreen").classList.remove("hidden");startGame()}
function toggleSound(){soundEnabled=!soundEnabled;$("soundBtn").textContent=soundEnabled?"🔊":"🔇"}
$("answer").addEventListener("keydown",e=>{if(e.key==="Enter")checkAnswer()});$("best").textContent=best();
</script></body></html>
